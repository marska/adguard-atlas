# Reference deployment of AdGuard Atlas.
#
#   docker compose up -d            then open http://<host>:8080
#
# The app has no login of its own: publish the port on a trusted network only, or
# put it behind a reverse proxy that authenticates.

services:
  adguard-atlas:
    image: marskadh/adguard-atlas:latest
    # Built from this checkout when the image is not present locally.
    # Remove this line to always use the published image.
    build: .
    container_name: adguard-atlas
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # To try the image first, set DEMO=true and drop everything else below.
      # DEMO: "true"

      ADGUARD_1_URL: "http://192.168.1.2:3000"
      ADGUARD_1_USER: "atlas"
      ADGUARD_1_PASSWORD_FILE: /run/secrets/adguard_1_password
      # ADGUARD_1_NAME: "primary"
      # ADGUARD_1_INSECURE_TLS: "true"     # self-signed https panel

      # A second resolver, if you run one:
      # ADGUARD_2_URL: "http://192.168.1.3:3000"
      # ADGUARD_2_USER: "atlas"
      # ADGUARD_2_PASSWORD_FILE: /run/secrets/adguard_2_password

      # Where the arcs start. Never derived from your public IP.
      HOME_LAT: "52.23"
      HOME_LON: "21.01"
      # HOME_LABEL: "Home"

      # POLL_INTERVAL_MS: "2000"
      # WINDOW_MINUTES: "15"
      # PRIVACY_MODE: "true"
      # IGNORE_CLIENTS: "192.168.1.9,nas"
      # IGNORE_DOMAINS: "lan,example.org"
    secrets:
      - adguard_1_password
    # To use your own MaxMind GeoLite2-City database instead of the bundled DB-IP one:
    # volumes:
    #   - ./GeoLite2-City.mmdb:/data/GeoLite2-City.mmdb:ro
    # and add to environment:  GEOIP_DB: /data/GeoLite2-City.mmdb

    # Hardening. The container writes nothing, so it needs no volume and no tmpfs.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 128
    mem_limit: 384m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

secrets:
  adguard_1_password:
    # A file containing only the password. Keep it out of version control;
    # it must be readable by uid 10001 (chmod 644, or chown 10001).
    file: ./secrets/adguard_1_password
